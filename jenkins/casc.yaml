# Jenkins Configuration as Code. Everything here is applied at boot, so the
# container comes up with the job already defined and no setup wizard.
jenkins:
  systemMessage: "employee-api-ganesh PoC - app pipeline. Terraform is owned by GitHub Actions."
  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: |
      pipelineJob('employee-api-ganesh') {
        description('Build, smoke test, push to ECR, roll out to ECS.')
        // Declared here, not only in the Jenkinsfile: a declarative
        // triggers block is installed on the job by a build parsing the
        // Jenkinsfile, and this DSL is re-applied on every boot - so a
        // restart would wipe it and nothing would poll until the next
        // manual build.
        //
        // It has to be a property, not the DSL's top-level triggers block:
        // a pipeline job keeps its triggers in PipelineTriggersJobProperty,
        // so a <triggers> element is dropped when the job is loaded.
        properties {
          pipelineTriggers {
            triggers {
              pollSCM {
                scmpoll_spec('H/2 * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/schemabotview/employee-api-ganesh.git')
                }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
