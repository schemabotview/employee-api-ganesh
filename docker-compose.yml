services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Named explicitly so the local build is one obvious tag, not
    # compose's default <dir>-<service>, and never collides with the
    # employee-api-ganesh:<build> tags Jenkins produces on the same daemon.
    image: employee-api-ganesh:local
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: localpass
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
